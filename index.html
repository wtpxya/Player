  <!-- External save controls -->
  <style>
    #saveTools{position:fixed;right:10px;bottom:10px;z-index:10;font:14px Arial,sans-serif}
    #saveTools button{border:1px solid #aaa;border-radius:7px;padding:9px 12px;background:#f2f2f2;color:#111;font-size:14px}
    #saveToolsToggle{background:rgba(0,0,0,.82)!important;color:white!important;border-color:#777!important}
    #saveToolsPanel{display:flex;flex-direction:column;gap:7px;margin-top:7px;padding:9px;border-radius:10px;background:rgba(0,0,0,.82)}
    #saveToolsPanel[hidden]{display:none}
    #saveStatus{max-width:210px;color:white;font-size:12px;line-height:1.3}
    @media(max-width:600px){#saveTools{right:6px;bottom:6px}#saveTools button{padding:8px 10px}#saveToolsPanel{padding:7px}}
  </style>
  <div id="saveTools">
    <button type="button" id="saveToolsToggle" aria-expanded="true" aria-controls="saveToolsPanel">Masquer les sauvegardes</button>
    <div id="saveToolsPanel">
      <button type="button" id="exportSaveButton">Exporter ma sauvegarde</button>
      <button type="button" id="importSaveButton">Importer une sauvegarde</button>
      <input id="saveImportInput" type="file" accept=".json,application/json" hidden>
      <div id="saveStatus" role="status" aria-live="polite">Sauvegarde externe</div>
    </div>
  </div>

  <!--File input START-->
  <style>
    #overlay {
      position: fixed;
      display: none;
      align-items: center;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 2;
      cursor: pointer;
      color: rgb(255, 255, 255);
      font-size: 20px;
    }

    #overlay div {
      margin: auto;
    }
  </style>
  <div id="overlay" ondragover="event.preventDefault()">
    <div>
      <h2>Milovana is back!</h2>
      Please choose a .json-file of a milovana Tease
      <br><br>
      <input id="fileInput" type="file" accept=".json">
    </div>
  </div>
  <script>
    document.getElementById("overlay").style.display = "flex";

    function getUploadedJson() {
      return new Promise((resolve) => {
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('change', async function (event) {
          const file = event.target.files[0];
          if (file) {
            try {
              let json = JSON.parse(await file.text())
              document.getElementById("overlay").style.display = "none";
              resolve(json);
            } catch {
              alert("Invalid File. Try again");
            }

          }
        }, { once: true }); // `{ once: true }` ensures the event listener is removed after the file upload
      });
    }
  </script>
  <!--File input END-->
